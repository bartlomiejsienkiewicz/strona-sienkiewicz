# ============================================================
# Konfiguracja Netlify
# Dokumentacja: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

[build]
  # Generuje podstrony artykułów, sitemap.xml i robots.txt (patrz build.js)
  command = "node build.js"
  publish = "dist"

# Panel edytora (Decap CMS) i katalog "uploads" na zdjęcia dodawane w edytorze
# powinny trafiać do finalnej publikacji bez zmian — build.js już je kopiuje
# do dist/, więc dodatkowych przekierowań nie potrzeba.

# Nagłówki cache: pliki HTML zawsze świeże, reszta może być cache'owana dłużej
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/common.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
